<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member OSMIB AUF</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">

    <!-- ===== NAVBAR ===== -->
    <header class="navbar">
      <div class="nav-left">
        <button class="icon-btn icon-btn--dark" aria-label="Profile">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/>
          </svg>
        </button>
        <button class="icon-btn icon-btn--blue" aria-label="Add">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
      </div>

      <nav class="nav-links">
        <a href="#">Home</a>
        <a href="#">About Us</a>
        <a href="#">Programs</a>
        <a href="#">Contact</a>
        <a href="#" class="active">Our Members</a>
      </nav>

      <div class="nav-right">
        <a href="#" class="btn btn--outline">Log in</a>
        <a href="#" class="btn btn--filled">Sign up</a>
      </div>
    </header>

    <!-- ===== HERO BANNER ===== -->
    <section class="hero-wrap">
      <button class="arrow arrow--left" aria-label="Previous">
        <a href="index.html">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#5b7fd0" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l-8 8 8 8"/></svg>
      </button>

      <div class="hero">
        <div class="hero-circle"></div>
        <span class="star s1"></span><span class="star s2"></span><span class="star s3"></span>
        <span class="star s4"></span><span class="star s5"></span><span class="star s6"></span>

        <!-- Your logo goes here (small, top-left) -->
        <div class="hero-logo">
          <img src="osmib25.png" alt="Logo OSMIB">
        </div>

        <div class="hero-text">
          <h1>Putri Raina</h1>
          <p>Wakil Ketua OSMIB yang have, masyaallah patut dicontoh.</p>
        </div>

        <!-- Put your transparent PNG artwork here -->
        <div class="hero-art">
          <img src="rain.png" alt="Raina Contoh">
        </div>

        <div class="dots">
          <span class="dot dot--active"></span><span class="dot"></span><span class="dot"></span>
        </div>
      </div>

      <button class="arrow arrow--right" aria-label="Next">
        <a href="jihanja.html">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#5b7fd0" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4l8 8-8 8"/></svg>
      </button>
    </section>

    <!-- ===== BOTTOM GRID ===== -->
    <main class="grid">

      <!-- Artwork -->
      <section class="artwork">
        <h2>Artwork <span class="chev">&gt;</span></h2>
        <div class="art-row">
          <figure class="art-card art-card--1">
            <img src="artwork-1.jpg" alt="" onerror="this.style.display='none'">
            <figcaption>by @artist1</figcaption>
          </figure>
          <figure class="art-card art-card--2">
            <img src="artwork-2.jpg" alt="" onerror="this.style.display='none'">
            <figcaption>by @artist2</figcaption>
          </figure>
        </div>
        <a href="#" class="view-more">View More</a>
      </section>

      <!-- Recent Search -->
      <section class="recent">
        <h2>About her:</h2>
        <ul>
          <li class="r1"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>10 Juni 2011</li>
          <li class="r2"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>IX-A</li>
          <li class="r4"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>"Selalu BAB setelah makan."</li>
          <li class="r5"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></li>
        </ul>
      </section>

      <!-- Stickers -->
      <section class="stickers">
        <div class="sticker">
          <button class="close" aria-label="Remove">&times;</button>
          <img src="sticker-1.png" alt="" onerror="this.style.display='none'">
        </div>
        <div class="sticker">
          <button class="close" aria-label="Remove">&times;</button>
          <img src="sticker-2.png" alt="" onerror="this.style.display='none'">
        </div>
      </section>

      <!-- Info cards -->
      <section class="info">
        <article class="info-card">
          <svg class="info-icon" viewBox="0 0 48 48" width="42" height="42" fill="none" stroke="#6e9be0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M24 4v40M7 14l34 20M7 34l34-20"/>
            <path d="M24 4l-4 5m4-5l4 5M24 44l-4-5m4 5l4-5M7 14l6 0m-6 0l2 6M41 34l-6 0m6 0l-2-6M7 34l2-6m-2 6l6 0M41 14l-2 6m2-6l-6 0"/>
            <circle cx="24" cy="24" r="4" fill="#cfe0ff"/>
          </svg>
          <div>
            <h3>Kesan</h3>
            <p>OSMIB kerenn cinta.</p>
          </div>
        </article>

        <article class="info-card">
          <svg class="info-icon" viewBox="0 0 48 48" width="42" height="42" fill="none" stroke="#3f78d8" stroke-width="2.2" stroke-linejoin="round">
            <path d="M24 6c4 4 9 4 14 3-1 6 1 10 4 14-5 1-8 4-9 9-4-2-7-1-9 3-2-4-5-5-9-3-1-5-4-8-9-9 3-4 5-8 4-14 5 1 10 1 14-3z" fill="#9cc0ff"/>
            <circle cx="24" cy="23" r="4" fill="#fff"/>
          </svg>
          <div>
            <h3>Pesan</h3>
            <p> love you all guys.</p></p>
          </div>
        </article>
      </section>

    </main>
  </div>
</body>
</html>
